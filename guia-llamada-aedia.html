<!DOCTYPE html>
<html lang="es">
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#060606">
<meta name="description" content="Material interno del equipo de cierre para la cuenta de AEDIA.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía de llamada AEDIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#060606;--card:#0d0d0d;--raise:#141414;--line:#262219;--ink:#EDE6D6;--dim:#A39C8C;--gold:#C9A84C;--gold2:#8E763A;--tint:rgba(201,168,76,.10);--risk:#E08A7A;--risk-t:rgba(224,138,122,.10);--ok:#8FBF8F;
--disp:"Cormorant Garamond",Georgia,serif;--caps:"Cinzel",Georgia,serif;--body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;text-align:left;hyphens:none}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:#050505;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:30px;height:34px;flex:none}
.brand b{font-family:var(--caps);letter-spacing:.14em;font-size:15px;font-weight:600;white-space:nowrap}
.brand b span{color:var(--gold)}
.brand small{display:block;color:var(--dim);font-size:12px;letter-spacing:.04em}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.who .live{font-size:13px;color:var(--gold);border:1px solid var(--gold2);border-radius:999px;padding:4px 10px;white-space:nowrap}
.app{display:grid;grid-template-columns:200px minmax(0,1fr) 360px;gap:0;min-height:calc(100vh - 59px)}
/* izquierda */
.steps{border-right:1px solid var(--line);padding:18px 12px 80px;display:flex;flex-direction:column;gap:4px;position:sticky;top:59px;align-self:start;height:calc(100vh - 59px)}
.steps button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:var(--dim);font-size:14px}
.steps button .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--gold2);display:grid;place-items:center;font-size:12px;flex:none}
.steps button.done{color:var(--ink)}
.steps button.done .n{background:var(--gold2);color:#060606;border-color:var(--gold2)}
.steps button.cur{background:var(--tint);color:var(--gold)}
.steps button.cur .n{background:var(--gold);color:#060606;border-color:var(--gold)}
.steps .foot{margin-top:auto;font-size:12px;color:var(--dim)}
/* centro */
.main{padding:26px 28px 110px;min-width:0}
.eyebrow{font-family:var(--caps);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--disp);font-weight:600;font-size:34px;line-height:1.15;margin:6px 0 10px}
h2{font-family:var(--disp);font-weight:600;font-size:26px;line-height:1.2;margin:0 0 10px}
h3{font-family:var(--caps);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:20px 0 8px;font-weight:600}
p{margin:0 0 10px}
.say{font-size:19px;line-height:1.5;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:16px 18px;margin:12px 0}
.say .lab{display:block;font-family:var(--caps);font-size:11px;letter-spacing:.16em;color:var(--gold);margin-bottom:6px}
.hint{color:var(--dim);font-size:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px;margin:14px 0}
.opt{cursor:pointer;background:var(--card);border:1px solid #2e2a22;border-radius:8px;padding:13px 14px;text-align:left;font-size:15px;transition:border-color .12s}
.opt:hover{border-color:var(--gold2)}
.opt.on{border-color:var(--gold);background:var(--tint);color:#fff}
.opt kbd{float:right;color:var(--dim);font-size:12px;font-family:var(--body)}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qcount{color:var(--dim);font-size:13px;white-space:nowrap}
.answered{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--dim);cursor:pointer;background:none}
.chip b{color:var(--ink);font-weight:500}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin:10px 0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--dim);min-width:0}
label.f input,label.f select,label.f textarea{width:100%;min-width:0;background:#0b0b0b;border:1px solid #2e2a22;border-radius:6px;padding:10px 11px;color:var(--ink);font-size:15px}
label.f textarea{min-height:80px;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.btn{cursor:pointer;border:1px solid var(--gold);background:var(--gold);color:#060606;border-radius:6px;padding:11px 16px;font-weight:600;font-size:15px}
.btn.sec{background:none;color:var(--gold)}
.btn.ghost{background:none;border-color:#2e2a22;color:var(--dim)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:12px 0}
.box ul,.box ol{margin:6px 0 0;padding-left:20px}.box li{margin-bottom:5px}
.note{background:var(--tint);border-left:3px solid var(--gold);border-radius:6px;padding:11px 14px;margin:12px 0;font-size:15px}
.risk{background:var(--risk-t);border:1px solid rgba(224,138,122,.35);border-left:3px solid var(--risk);border-radius:6px;padding:11px 14px;margin:12px 0;font-size:15px}
.risk b{color:var(--risk)}
.pend{display:inline-block;font-size:11px;letter-spacing:.06em;color:var(--risk);border:1px solid rgba(224,138,122,.5);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.case{cursor:pointer;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px}
.case b{display:block;color:var(--ink);margin-bottom:3px}
.case span{color:var(--dim)}
.case:hover{border-color:var(--gold2)}
pre.crm{white-space:pre-wrap;background:#0a0a0a;border:1px solid var(--line);border-radius:8px;padding:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.msg{background:#0a0a0a;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:15px;white-space:pre-wrap}
/* derecha */
.side{border-left:1px solid var(--line);position:sticky;top:59px;align-self:start;height:calc(100vh - 59px);display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;flex:1;text-align:center;padding:12px 2px;font-family:var(--caps);font-size:10px;letter-spacing:.08em;color:var(--dim);border-bottom:2px solid transparent}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.pane{padding:16px 18px 90px;overflow:auto;flex:1}
.rec{border:1px solid var(--gold);border-radius:10px;padding:14px 16px;background:linear-gradient(180deg,rgba(201,168,76,.08),transparent)}
.rec .lab{font-family:var(--caps);font-size:11px;letter-spacing:.16em;color:var(--gold)}
.rec .name{font-family:var(--disp);font-size:24px;font-weight:600;line-height:1.15;margin:4px 0 6px;color:#fff}
.rec .meta{font-size:14px;color:var(--dim)}
.conf{display:flex;gap:4px;margin:8px 0 2px}
.conf i{height:5px;flex:1;border-radius:3px;background:#2a2620}
.conf i.on{background:var(--gold)}
.why{font-size:14px;margin-top:8px}
.alt{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.alt b{color:var(--ink)}
.side ul{padding-left:18px;margin:6px 0}.side li{margin-bottom:6px;font-size:14px}
.abr{background:var(--risk-t);border:1px solid var(--risk);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:14px}
.abr b{color:var(--risk)}
.obj{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:var(--card)}
.obj summary{cursor:pointer;padding:10px 12px;font-weight:600;font-size:14px;list-style:none}
.obj summary::-webkit-details-marker{display:none}
.obj[open] summary{color:var(--gold)}
.obj div{padding:0 12px 12px;font-size:14px}
.obj div p{margin:0 0 8px}
.search{width:100%;background:#0b0b0b;border:1px solid #2e2a22;border-radius:6px;padding:10px 11px;font-size:15px}
.mini{font-size:13px;color:var(--dim)}
/* barra inferior */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(6,6,6,.96);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;flex-wrap:wrap}
.bar button{cursor:pointer;background:none;border:1px solid var(--gold2);color:var(--gold);border-radius:6px;padding:9px 14px;font-weight:600;font-size:14px}
.bar button.pri{background:var(--gold);color:#060606;border-color:var(--gold)}
.bar .sp{width:14px}
.help{cursor:pointer;width:30px;height:30px;border-radius:50%;border:1px solid var(--gold2);background:none;color:var(--gold);font-weight:700}
.strip{background:#0b0b0b;border:1px dashed var(--gold2);border-radius:8px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.strip b{color:var(--gold)}
.ok{color:var(--ok)}
.scen{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14.5px;background:var(--card)}
.scen.hit{border-color:var(--gold);background:var(--tint)}
.scen b{color:#fff}
.scen .tag{float:right;font-size:11px;color:var(--gold);letter-spacing:.06em}
table.cmp{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
table.cmp td,table.cmp th{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top;text-align:left}
table.cmp th{color:var(--gold);font-family:var(--caps);font-size:10px;letter-spacing:.08em}
.cat{border-bottom:1px solid var(--line);padding:8px 0;font-size:13.5px}
.cat b{color:#fff}
.voc{border-bottom:1px solid var(--line);padding:8px 0;font-size:13.5px}
.voc b{color:var(--gold)}
.mrec{display:none}
.tour{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:16px}
.tour[hidden]{display:none}
.tour .card{max-width:520px;width:100%;background:#0d0d0d;border:1px solid var(--gold);border-radius:12px;padding:22px}
.tour .card h2{margin-bottom:8px}
.tour .dots{display:flex;gap:6px;margin:12px 0}
.tour .dots i{width:8px;height:8px;border-radius:50%;background:#333}.tour .dots i.on{background:var(--gold)}
@media (max-width:1100px){.app{grid-template-columns:170px minmax(0,1fr) 320px}}
@media (max-width:900px){
 .app{grid-template-columns:1fr}
 .steps{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
 .steps button{flex:none;font-size:13px;padding:7px 8px}
 .steps .foot{display:none}
 .side{position:static;height:auto;border-left:0;border-top:1px solid var(--line);order:3}
 .main{padding:20px 16px 30px}
 .pane{padding:14px 16px 110px}
 h1{font-size:28px}
 .say{font-size:17px}
 .who .live{display:none}
 .bar{gap:6px;padding:8px}
 .bar button{padding:8px 10px;font-size:13px}
 .bar .sp{display:none}
 .mrec{display:block;position:fixed;left:0;right:0;bottom:56px;z-index:29;background:#0b0b0b;border-top:1px solid var(--gold2);padding:7px 14px;font-size:13px}
 .mrec b{color:var(--gold)}
 .main{padding-bottom:140px}
 .bar .k{display:none}
}
</style>
</head>

e de la IA", "para": "Perfiles legales, de compliance y dirección: marco de gobierno de la IA, riesgos, AI Act, ética, privacidad y auditoría.", "noes": "no tiene responsabilidad legal o de cumplimiento", "aviso": "", "precio": "840 €", "conf": false, "tipo": "bonificable", "horas": "120 horas de dedicación", "aprende": ["El Reglamento Europeo de IA (AI Act) en detalle, auditoría de sesgos algorítmicos, propiedad intelectual en el entrenamiento de LLMs y gestión de riesgos bajo los marcos ISO 42001 y NIST."], "consigue": [], "tit": "Tasa de titulación universitaria: 120 € por cada una de ellas.", "fin": "840 € en 6 meses: 147,44 €/mes", "extra": ""}, "competencias": {"k": "competencias", "name": "Curso de Formación en IA Generativa y Gobernanzas Digitales / Operativa en IA", "short": "Competencias digitales («IA legal»)", "para": "Solo empresas y grupos: ayuda a la empresa a formar a quien usa IA, la alfabetización que pide el art. 4 del Reglamento europeo de IA. Es como la PRL de la IA. En el CRM aparece como «IA legal».", "noes": "es una persona sola sin empresa detrás (ofrece el Toolkit)", "aviso": "Grupos desde 5 (con 4, pidiendo permiso). La obligación es de la empresa: el curso le ayuda a formar y documentar. En la sesión 2 se mencionó también 210 € para particular: confirmar con Macarena.", "precio": "90 € por empleado (grupos desde 5)", "conf": true, "tipo": "bonificable", "horas": "14–16 h según la sesión 2 · confirmar", "aprende": ["Comprenderás el funcionamiento de los LLMs y aprenderás a diseñar agentes personalizados como Custom GPTs, Gems y Copilot Agents.", "Te formarás en la auditoría de resultados utilizando el método R.A.V. para detectar alucinaciones y sesgos algorítmicos.", "Aprenderás a proteger los datos sensibles cumpliendo con el RGPD y aplicando protocolos prácticos de limpieza y anonimización de datos (PII cleaning)."], "consigue": ["Desarrollarás la capacidad de prevenir fugas de información (Data Leakage) corporativa y asumirás la autoría de titulación universitaria: 25 € por cada una de ellas.", "fin": "", "extra": ""}, "openai": {"k": "openai", "name": "Microcredencial en OpenAI Ads", "short": "OpenAI Ads", "para": "Equipos de marketing que quieren hacer publicidad dentro de ChatGPT. Pocos leads, pero muy cualificados.", "noes": "no hace publicidad", "aviso": "Solo si lo pide expresamente. Confirmar si se mantiene en 2027.", "precio": "210 €", "conf": true, "tipo": "bonificable", "horas": "20 h según la sesión 2 · confirmar", "aprende": ["Dominará el uso de ChatGPT y la API de OpenAI para la generación masiva de copys publicitarios persuasivos, creación de variaciones de anuncios A/B a escala y segmentación predictiva de audiencias.", "Aprenderá a analizar el rendimiento de las campañas (ROAS/CTR) en tiempo real utilizando agentes GPT personalizados y a automatizar flujos de trabajo en plataformas como Meta Ads y Google Ads."], "consigue": [], "tit": "Tasa de titulación universitaria: 25 € por cada una de ellas.", "fin": "", "extra": ""}, "ciber": {"k": "ciber", "name": "Bootcamp en Ingeniería de Defensa, Automatización y Ciberseguridad con IA", "short": "Ciberseguridad con IA", "para": "Perfiles de seguridad e IT: detección, análisis y respuesta ante amenazas con IA.", "noes": "no es perfil técnico de seguridad", "aviso": "Campaña en preparación: se explicará en otra sesión.", "precio": "1.190 €", "conf": true, "tipo": "bonificable", "horas": "Horas por confirmar", "aprende": ["Dominará la detección de malware polimórfico y la ingeniería social avanzada con LLMs.", "Aprenderá a construir arquitecturas SOAR (respuesta a incidentes) autónomas con n8n, realizar livecoding forense con Cursor IDE y blindar aplicaciones de IA corporativas aplicando el OWASP Top 10 para LLMs.", "Además, se formará en DevSecOps, control de fraude y cumplimiento normativo (EU AI Act) para gestionar el «Shadow AI»."], "consigue": [], "tit": "Tasa de titulación universitaria: 120 € por cada una de ellas.", "fin": "", "extra": ""}, "datos": {"k": "datos", "name": "Máster en Ingeniería de Datos (Big Data)", "short": "Máster en Ingeniería de Datos", "para": "Máster muy técnico y largo (Big Data, Python, SQL, Spark, cloud).", "noes": "no es perfil técnico", "aviso": "Avisa a Abraham: entra en la llamada por Meet.", "precio": "3.900 €", "conf": false, "tipo": "pago", "horas": "550 horas de dedicación", "aprende": ["Arquitecturas de datos, procesamiento con Python, SQL avanzado, Big Data con Spark y despliegue Cloud (AWS/Docker/Kubernetes)."], "consigue": [], "tit": "Doble titulación AEDIA + UTAMED opcional: tasa del 10 % del coste del curso.", "fin": "", "extra": ""}, "desconexion": {"k": "desconexion", "name": "Desconexión Digital", "short": "Desconexión Digital", "para": "Empresas que necesitan su protocolo de desconexión digital. Pocos leads, pero cierran.", "noes": "no es una empresa", "aviso": "Solo si lo pide.", "precio": "120 € · 420 € grupo de 5", "conf": false, "tipo": "bonificable", "horas": "16 horas", "aprende": ["El marco normativo español (LOPDGDD y Ley de Trabajo a Distancia), prevención de riesgos psicosociales como el tecnoestrés y el diseño de políticas internas y protocolos de desconexión efectivos."], "consigue": [], "tit": "Solo titulación propia de AEDIA, verificable con blockchain.", "fin": "", "extra": ""}, "comites": {"k": "comites", "name": "Comités de IA (in company)", "short": "Comités de IA (in company)", "para": "Empresas que venden IA: masterclass con abogado y sesión técnica. Va por presupuesto.", "noes": "", "aviso": "Avisa a Abraham: va por presupuesto.", "precio": "Presupuesto", "conf": false, "tipo": "presupuesto", "horas": "", "aprende": [], "consigue": [], "tit": "", "fin": "", "extra": ""}, "airflow": {"k": "airflow", "name": "Airflow Profesional", "short": "Airflow Profesional", "para": "Orquestación de pipelines de datos con Apache Airflow. Residual.", "noes": "", "aviso": "Avisa a Abraham.", "precio": "420 €", "conf": false, "tipo": "pago", "horas": "", "aprende": [], "consigue": [], "tit": "", "fin": "", "extra": ""}}, "apertura": "«Buenas, ¿[nombre del interesado]? Soy [nombre de la asesora], asesora de formación de AEDIA. Te llamo porque hemos recibido tu solicitud de información sobre nuestras formaciones en IA. ¿Tienes unos minutos para que veamos cuál es la formación que mejor encaja con tu perfil?»", "voc": [["Inteligencia artificial (IA)", "Sistemas informáticos que realizan tareas que normalmente requieren inteligencia humana: entender textos, reconocer imágenes, predecir o generar contenido."], ["IA generativa (GenAI)", "IA que crea contenido nuevo (texto, imágenes, audio, vídeo o código) a partir de una instrucción. ChatGPT, Claude o Gemini son IA generativa."], ["IA predictiva", "IA que analiza datos históricos para anticipar lo que va a pasar: demanda, riesgos, bajas de clientes…"], ["IA simbólica", "Enfoque clásico de la IA basado en reglas escritas por personas («si pasa esto, haz aquello»), frente al aprendizaje a partir de datos."], ["LLM (modelo de lenguaje grande)", "Modelo de IA entrenado con enormes cantidades de texto que entiende y redacta lenguaje natural. Es el «motor» de ChatGPT, Claude, Gemini o Copilot."], ["Token", "Trozo de palabra con el que trabaja un LLM. Los modelos cuentan, cobran y limitan su memoria en tokens (aprox. ¾ de palabra cada uno)."], ["Ventana de contexto", "Cantidad máxima de texto (en tokens) que un modelo puede «tener en mente» a la vez en una conversación o un documento."], ["Alucinación", "Respuesta de la IA que suena convincente pero es falsa o inventada. Por eso los cursos enseñan a verificar lo que produce."], ["Sesgo algorítmico", "Resultado injusto o desequilibrado de la IA porque los datos con los que aprendió tenían prejuicios o huecos."], ["Machine Learning (aprendizaje automático)", "Rama de la IA en la que el sistema aprende patrones a partir de datos, sin programar cada regla a mano."], ["Deep Learning (aprendizaje profundo)", "Tipo de Machine Learning con redes neuronales de muchas capas. Es la base de la visión artificial, la voz y los LLM."], ["Red neuronal", "Estructura matemática inspirada en el cerebro que aprende ajustando conexiones entre «neuronas» artificiales."], ["Transformer", "Arquitectura de red neuronal en la que se basan casi todos los LLM actuales (la «T» de GPT)."], ["NLP (procesamiento del lenguaje natural)", "Área de la IA que trabaja con el lenguaje humano: entender, resumir, traducir o clasificar textos."], ["Visión artificial", "IA que interpreta imágenes y vídeo: reconocer objetos, leer documentos, inspeccionar productos o radiografías."], ["Multimodal", "Modelo capaz de trabajar a la vez con varios tipos de información: texto, imagen, audio y vídeo."], ["Fine-tuning", "Reentrenar un modelo ya hecho con datos propios para especializarlo en una tarea o un estilo."], ["Embeddings", "Forma de convertir textos en números que representan su significado, para que la IA encuentre contenidos parecidos."], ["RAG (generación aumentada por recuperación)", "Técnica para que la IA responda consultando documentos propios (de la empresa, de un manual…) en lugar de solo su memoria. Reduce errores."], ["Base de datos vectorial", "Base de datos que guarda embeddings y permite buscar por significado. Es la pieza que hace funcionar el RAG."], ["Agente de IA", "IA que no solo responde: decide pasos y ejecuta acciones (buscar, escribir un correo, actualizar un CRM) para cumplir un objetivo."], ["Sistema multiagente", "Varios agentes de IA que se reparten tareas y colaboran, cada uno especializado en una parte del trabajo."], ["Agente de voz", "Agente de IA que habla por teléfono o por voz con personas: atiende llamadas, agenda citas o cualifica clientes."], ["Chatbot", "Programa que conversa por texto con usuarios. Con IA generativa entiende preguntas abiertas, no solo menús."], ["Modelo local / open source", "Modelo de IA que se instala en los propios equipos de la empresa (por ejemplo Llama), sin enviar datos a la nube de un proveedor."], ["Prompt", "Instrucción o pregunta que se le da a la IA. Cuanto mejor se formula, mejor es el resultado."], ["Prompt Engineering (ingeniería de prompts)", "Técnica de diseñar instrucciones claras y estructuradas para obtener de la IA resultados precisos y repetibles."], ["Zero-shot / Few-shot", "Pedir algo a la IA sin ejemplos (zero-shot) o dándole unos pocos ejemplos del resultado esperado (few-shot)."], ["Chain-of-Thought (cadena de pensamiento)", "Pedir a la IA que razone paso a paso antes de responder. Mejora los resultados en cálculos y problemas complejos."], ["Prompt chaining", "Encadenar varios prompts, de modo que la salida de uno alimenta al siguiente, para resolver tareas largas."], ["System prompt (instrucciones del sistema)", "Instrucciones de fondo que definen cómo se comporta un asistente o agente en todas sus respuestas."], ["Framework C.T.R.F.", "Método de AEDIA para escribir prompts: Contexto, Tarea, Restricciones y Formato."], ["Método R.A.V.", "Método de AEDIA para auditar resultados de la IA: Rastreo, Auditoría y Aislamiento de Variables. Sirve para detectar alucinaciones y sesgos."], ["Checklist P.O.R.V.", "Lista de AEDIA para revisar lo que genera la IA antes de usarlo: Pertinencia, Ortografía/Estilo, Realidad de datos y Verificación de sesgo."], ["Human-in-the-Loop (supervisión humana)", "Principio de que una persona revisa y valida lo que hace la IA antes de que tenga efecto. Lo exige el AI Act en muchos usos."], ["Mentalidad IA / AI-first", "Forma de trabajar que parte de preguntarse qué puede hacer la IA en cada tarea, para dedicar el tiempo a lo que aporta valor."], ["ChatGPT", "Asistente de IA generativa de OpenAI, el más conocido del mercado."], ["Custom GPTs", "Asistentes personalizados que se crean dentro de ChatGPT con instrucciones y documentos propios, sin programar."], ["Claude", "Asistente de IA generativa de Anthropic. Destaca en redacción, análisis de documentos largos y programación."], ["Claude Projects / Artifacts", "Funciones de Claude: Projects agrupa documentos y conversaciones de un tema; Artifacts crea documentos, gráficos o pequeñas aplicaciones que se ven al momento."], ["Gemini", "Asistente de IA generativa de Google, integrado con Gmail, Drive y el resto de Google Workspace."], ["Gems", "Asistentes personalizados de Gemini, el equivalente a los Custom GPTs de ChatGPT."], ["Microsoft Copilot / M365 Copilot", "IA de Microsoft integrada en Word, Excel, PowerPoint, Outlook y Teams. Requiere licencia de la empresa."], ["Copilot Agents / Agent Builder", "Herramientas de Microsoft para crear agentes personalizados conectados a documentos de la empresa (SharePoint, OneDrive…) sin programar."], ["NotebookLM", "Herramienta de Google que crea un asistente a partir de tus documentos: resume, responde preguntas y genera guías de estudio."], ["Microsoft Designer / Clipchamp", "Herramientas de Microsoft para crear imágenes y diseños con IA (Designer) y editar vídeo (Clipchamp)."], ["Midjourney", "Herramienta de IA para generar imágenes de alta calidad a partir de texto."], ["Suno", "Herramienta de IA que genera canciones y música a partir de una descripción."], ["Gamma", "Herramienta de IA que crea presentaciones y documentos visuales a partir de un texto o un esquema."], ["Runway / Freepik", "Plataformas de IA para generar y editar imágenes y vídeo creativo."], ["Scispace", "Asistente de IA para buscar, leer y resumir artículos científicos."], ["Enterprise Data Protection", "Protección de datos de las licencias empresariales (por ejemplo de Copilot): lo que escribe la empresa no se usa para entrenar el modelo."], ["Zero-Data Retention", "Configuración en la que el proveedor de IA no guarda los datos que se le envían."], ["No-Code", "Crear aplicaciones y automatizaciones con herramientas visuales, sin escribir código. Es el enfoque del IA & No-Code Bootcamp."], ["Low-Code", "Crear automatizaciones y agentes con herramientas visuales y algo de código cuando function secOf(A){var s=A.sector;if(A.puesto==='doc'&&(!s||s==='otro'))s='educacion';return s}
function visibleQ(){return Q.filter(function(q){return !q.cond||q.cond(S.ans)})}
function nAns(){return KEYQ.filter(function(k){return S.ans[k]}).length}
function rec(A,pre){
  var r={main:'',alt:'',why:'',rule:'',abraham:false,sino:[],notes:[],conf:0};
  KEYQ.forEach(function(k){if(A[k])r.conf++});
  var req=S.pedido;
  if(['datos','comites','airflow'].indexOf(req)>=0){r.main=req;r.abraham=true;r.why='es un programa que lleva Abraham directamente';r.rule='Curso que lleva Abraham';return fin(r,A,pre)}
  var sec=secOf(A),dec=A.busca==='decidir'||A.rol==='decidir',pers=A.personas,tecn=A.puesto==='tec'||A.puesto==='prog'||A.rol==='yo'||A.nivel==='avanzado';
  if(pers==='grande'){r.notes.push('Grupo grande: el presupuesto a medida se prepara con Macarena y Abraham. No concretes descuentos hasta saber el número exacto de personas y el crédito.')}
  if((A.busca==='norma'||A.puesto==='rrhh')&&A.pago!=='particular'&&A.pago!=='autonomo'&&pers!=='1'){
    r.main='competencias';r.alt='toolkit';r.rule='Formar al equipo';r.why='quieres formar a tu equipo en IA, y esta formación ayuda a la empresa a cumplir la obligación de formar a quien la usa';
    if(pers==='2-4')r.notes.push('Con 4 personas también se cierra, pidiendo permiso para el grupo. Con menos, valora el Toolkit.');
  }else if(SECK[sec]){
    r.main=SECK[sec];r.rule='Sector con formación propia';r.why='está hecho para '+SECN[sec]+': vas a trabajar problemas de tu día a día, no IA genérica';
    r.alt=A.ia==='copilot'?'microsoft':(A.puesto==='dir'&&dec?'genai':'nocode');
  }else if(A.puesto==='prog'||A.busca==='prog'){
    if(A.tiempo==='poco'){r.main='lowcode';r.alt='master-ai';r.rule='Quiere programar, poco tiempo';r.why='vas directo a lo práctico sin la dedicación que pide el máster'}
    else{r.main='master-ai';r.alt=A.puesto==='prog'?'sdd':'lowcode';r.rule='Quiere programar';r.why='quieres programar IA de verdad, de principio a fin'}
  }else if(A.busca==='auto'&&tecn&&A.rol!=='decidir'){
    if(A.tiempo==='poco'){r.main='nocode';r.alt='lowcode';r.rule='Automatizar, poco tiempo';r.why='también es bonificado y lo vas a poder aprovechar con el tiempo que tienes'}
    else{r.main='lowcode';r.alt='nocode';r.rule='Automatizar en serio';r.why='quieres crear agentes y automatizaciones de verdad, y sales con ellos funcionando'}
  }else if(A.ia==='copilot'){
    r.main='microsoft';r.alt=A.puesto==='dir'&&dec?'genai':'nocode';r.rule='Empresa con Copilot / Microsoft 365';r.why='ya trabajáis con Microsoft 365 y Copilot, así le sacas partido a lo que ya tenéis';
  }else if(A.puesto==='dir'&&(dec||(A.busca==='prod'&&A.rol!=='yo')||!A.busca)){
    r.main='genai';r.alt='toolkit';r.rule='Directivo que decide';r.why='no vas a montar tú los flujos: vas a decidir dónde tiene impacto la IA y cómo medir el retorno';
  }else if(A.busca==='auto'){
    r.main='nocode';r.alt='lowcode';r.rule='Automatizar sin perfil técnico';r.why='empiezas con una visión completa y sales con tus automatizaciones funcionando';
  }else{
    r.main='nocode';r.alt=A.puesto==='dir'?'genai':'toolkit';r.rule=A.nivel==='nada'?'Sin conocimientos de IA':'Perfil general';r.why='empiezas desde cero con una visión completa de la IA y sales con tus automatizaciones funcionando';
  }
  if(A.sector==='otro'&&!pre)r.notes.push('Su sector no tiene curso propio: la recomendación sale de su perfil y de lo que busca.');
  return fin(r,A,pre);
}
function fin(r,A,pre){
  if(pre)return r;
  if(A.pago==='autonomo')r.notes.push('Autónomo sin empleados: no puede bonificar y casi nunca cierra. Díselo pronto: precio completo o financiación. Si dice que no por precio: Executive AI Toolkit (210 €).');
  if(A.pago==='particular')r.notes.push('Por su cuenta: no se bonifica. Tarjeta, transferencia o financiación. Nunca le digas que a él se le bonifica.');
  if(r.main==='master-ai'&&A.pago==='empresa')r.notes.push('El máster casi siempre lo paga el alumno: bonificarlo es difícil.');
  if(r.main==='lowcode')r.sino.push(['Lo ve demasiado técnico','IA & No-Code, también bonificado']);
  if(r.main==='master-ai')r.sino.push(['Lo ve exigente o no tiene tiempo','Agentes de IA · Low-Code']);
  if(r.main!=='toolkit'&&!r.abraham)r.sino.push(['No quiere pagar o no puede bonificar','Executive AI Toolkit (210 €), la «última bala»']);
  if(A.pago==='empresa'&&A.personas&&A.personas!=='1'&&r.main!=='competencias')r.sino.push(['Más personas de la empresa usan IA','Competencias digitales para el equipo (90 € por empleado)']);
  return r;
}
function segMode(){return S.tipo!=='primera'&&S.pedido&&nAns()<2}
function cur(){var r=rec(S.ans);if(segMode()&&!S.elegido){r.main=S.pedido;r.rule='Curso de la propuesta enviada';r.why='es el curso que ya te enviamos y encaja con lo que buscabas';r.alt='';r.sino=[];r.notes=[];if(['datos','comites','airflow'].indexOf(S.pedido)>=0)r.abraham=true}r.final=S.elegido||r.main;r.manual=!!(S.elegido&&S.elegido!==r.main);return r}
function hasDiag(){return nAns()>=2||S.elegido||segMode()||['datos','comites','airflow'].indexOf(S.pedido)>=0}
function nm(){return (S.nombre||'').trim().split(/\s+/)[0]||'[nombre]'}
function cl(){return S.closer||'[tu nombre]'}
function cn(){var k=hasDiag()?cur().final:S.pedido;return k?C[k].short:'la formación'}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function tomorrow(){var d=new Date();d.setDate(d.getDate()+1);if(d.getDay()===6)d.setDate(d.getDate()+2);if(d.getDay()===0)d.setDate(d.getDate()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function puente(r){
  var p=S.pedido,f=r.final;if(!p||p===f||r.abraham||r.manual)return '';
  var t;
  if(p==='lowcode'&&f==='nocode')t='Low-Code es para quien va a dedicarle horas y entregar tareas. Si ahora no tienes ese tiempo, te diría que no es para ti. Este otro también es bonificado y sí lo vas a aprovechar.';
  else if(p==='master-ai'&&f==='lowcode')t='El máster pide mucha dedicación. Con tu situación te encaja más este, y vas directo a lo práctico.';
  else t='Lo que pediste, '+C[p].short+', está bien. Pero con lo que me cuentas, te encaja mejor '+C[f].short+'. Te cuento los dos y eliges tú.';

function pCurso(){

  +'<div class="why"><b>Por qué:</b> '+esc(r.rule)+(A.puesto?' · '+esc(LAB.puesto[A.puesto]):'')+(A.sector&&A.sector!=='otro'?' · '+esc(LAB.sector[A.sector]):'')+(A.busca?' · '+esc(LAB.busca[A.busca]):'')+(A.ia==='copilot'?' · Copilot':'')+'</div></div>';
  if(r.manual)h+='<p class="mini" style="margin-top:8px">La guía proponía: <b>'+esc(C[r.main].short)+'</b></p>';
  if(S.pedido&&S.pedido!==r.final)h+='<p class="mini" style="margin-top:8px">Pidió: <b>'+esc(C[S.pedido].short)+'</b></p>';
  if(r.abraham)h+='<div class="abr"><b>Avisa a Abraham.</b> '+esc(c.aviso)+'</div>';
  if(r.alt&&r.alt!==r.final)h+='<div class="alt">Alternativa: <b>'+esc(C[r.alt].short)+'</b> · '+esc(C[r.alt].precio)+'</div>';
  if(r.sino.length)h+='<h3>Si no cierra</h3><ul>'+r.sino.map(function(s){return '<li>'+esc(s[0])+' → <b>'+esc(s[1])+'</b></li>'}).join('')+'</ul>';
  if(r.notes.length)h+='<h3>Ojo</h3><ul>'+r.notes.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ul>';
  if(c.aviso&&!r.abraham)h+='<div class="note">'+esc(c.aviso)+'</div>';
  h+='<h3>Para quién</h3><p class="mini">'+esc(c.para)+'</p>';
  return h;
}

function objList(){var q=norm(QS.obj);return OBJ.filter(function(o){return !q||norm(o[0]+' '+o[1]+' '+o[2]).indexOf(q)>-1}).map(function(o){return '<details class="obj"'+(q?' open':'')+'><summary>«'+esc(o[1])+'»</summary><div><p>'+esc(o[2])+'</p>'+(o[3]?'<p class="mini"><b>Re-pregunta:</b> «'+esc(o[3])+'»</p>':'')+'</div></details>'}).join('')||'<p class="mini">No hay ninguna objeción con ese texto.</p>'}
function pFundae(){return '<h3 style="margin-top:0">Explícaselo al lead en 3 frases</h3><div class="say" style="font-size:15px">«FUNDAE es el crédito que tienen las empresas para formar a su plantilla; mucha gente lo conoce como la antigua tripartita. La empresa paga la formación al contratar y luego recupera el coste en sus cotizaciones. Con la encomienda firmada, que no tiene coste, consultamos cuánto crédito tenéis.»</div>'
 +'<h3>Lo que tienes que saber</h3><ul><li>El 95 % de lo que entra es FUNDAE. Con la encomienda devuelta, el 95 % acaba en venta, aunque tarde semanas.</li><li>La primera llamada casi nunca cierra: el lead suele querer intentarlo con su empresa.</li><li>Tú no consultas el crédito ni das cifras: lo hace Macarena cuando llega la encomienda.</li><li>Si la consulta de crédito funciona, la empresa está al corriente con Hacienda y la Seguridad Social.</li><li>Si el crédito no llega: 420 € para un empleado, salvo Low-Code (420 € bonificados y el resto lo paga la empresa). <span class="pend">confirmar</span></li><li>Empresas de 1 a 5 empleados suelen tener unos 420 €, más si guardaron del año anterior. <span class="pend">confirmar</span></li><li>Competencias digitales: 90 € por empleado, grupos desde 5.</li><li>El alumno tiene que hacer la formación entre las fechas de inicio y fin, con conexiones y tareas. AEDIA avisa a quien va retrasado.</li><li>AEDIA cobra al contratar; el inicio se comunica a FUNDAE con 3 días hábiles. En ese margen se paga y se entregan la ficha de alumno y el contrato.</li><li>Autónomo sin empleados: no bonifica.</li><li>Final de año: las empresas descubren crédito sin gastar y quieren usarlo.</li></ul><div class="risk"><b>Nunca</b> plantees que otra persona haga el curso a nombre del empleado bonificado, ni prometas la bonificación antes de la encomienda.</div>'
 +'<h3>Casos reales de AEDIA (para tu confianza, no como testimonio)</h3><ul class="mini"><li>Una fundación del sector salud cerró tras 20 días con la encomienda.</li><li>Un cliente con 12 empleados matriculó a 10 de golpe en la formación de cumplimiento.</li><li>Una empresa cerró 17 de Low-Code porque el jefe de departamento lo quiso para todos.</li><li>Alguien que entró por el máster, sin tiempo por un hijo, cerró Low-Code.</li></ul>'}
function pVoc(){return '<input class="search" id="vq" type="search" placeholder="Busca un término: RAG, n8n, encomienda…" value="'+esc(QS.voc)+'"><div id="vlist">'+vocList()+'</div>'}
function vocList(){var q=norm(QS.voc);var L=DATA.voc.filter(function(v){return !q||norm(v[0]+' '+v[1]).indexOf(q)>-1});return L.map(function(v){return '<div class="voc"><b>'+esc(v[0])+'</b><br>'+esc(v[1])+'</div>'}).join('')||'<p class="mini">No hay ningún término con ese texto.</p>'}
function pane(){document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===TAB)});

var V={ficha:vFicha,apertura:vApertura,diag:vDiag,propuesta:vPropuesta,pago:vPago,cierre:vCierre,crm:vCrm};
function render(){steps();document.getElementById('main').innerHTML=strip()+V[S.fase]();pane();bind();
  var i=PHASES.findIndex(function(p){return p[0]===S.fase});document.getElementById('bPrev').disabled=i===0&&!(S.fase==='diag'&&QI>0);document.getElementById('bNext').disabled=i===PHASES.length-1}

function bind(){
  [['fCloser','closer'],['fTipo','tipo'],['fNombre','nombre'],['fOrigen','origen'],['fPedido','pedido'],['fElegido','elegido'],['fMotivo','motivo'],['fRes','res'],['fCanal','canal'],['fFecha','fecha'],['fHora','hora'],['fDecide','decide'],['fRrhh','rrhh'],['fScore','score'],['fNota','nota']].forEach(function(p){
    var e=document.getElementById(p[0]);if(!e)return;
    var ev=(e.tagName==='SELECT'||e.type==='date'||e.type==='time')?'change':'input';
    e.addEventListener(ev,function(){S[p[1]]=e.value;
      if(p[0]==='fTipo')S.segui='';
      if(p[0]==='fRes'&&S.res==='nocontesta'&&!S.fecha)S.fecha=tomorrow();
      if(['fNombre','fDecide','fRrhh','fNota'].indexOf(p[0])>=0){steps();if(TAB==='curso')pane();var c=document.getElementById('crm');if(c)c.textContent=resumen();return}
      render()})});
  var t=document.getElementById('fTem');if(t)t.addEventListener('change',function(){S.temario=t.checked});
}

function prevQ(){if(QI>0){QI--;render()}else go('apertura')}
document.addEventListener('click',function(e){var b=e.target.closest('button,a');if(!b)return;var d=b.dataset;
  if(b.closest('#tour'))return;
  if(d.f){if(d.f==='propuesta'&&!hasDiag()){go('diag');return}go(d.f);return}
  if(d.go){if(b.disabled)return;go(d.go);return}
  if(d.t){TAB=d.t;pane();return}

  if(d.a){S.ans[d.a]=d.v;if(d.a==='puesto'&&d.v==='doc'&&!S.ans.sector)S.ans.sector='educacion';
    Object.keys(S.ans).forEach(function(k){var q=Q.find(function(x){return x.id===k});if(q&&q.cond&&!q.cond(S.ans))delete S.ans[k]});
    var vq=visibleQ();if(!(d.a==='pago'&&d.v==='nosabe')){var i=vq.findIndex(function(q){return q.id===d.a});var k=vq.findIndex(function(q,j){return j>i&&!S.ans[q.id]});QI=k<0?(i<vq.length-1?i+1:i):k}
    render();return}
  if(d.qi!=null){QI=+d.qi;render();return}
  if(d.qprev){QI--;render();return}
  if(d.qnext){QI++;render();return}
  if(d.alt){S.elegido=d.alt;S.motivo='busca';render();return}
  if(d.seg){S.segui=d.seg;render();return}
  if(d.mas){S.mas=d.mas;render();return}
  if(d.res){S.res=d.res;if(S.res==='nocontesta'&&!S.fecha)S.fecha=tomorrow();go('cierre');return}
  if(d.norec){S.norec=!S.norec;render();return}
  if(d.copy){copy(d.copy==='crm'?resumen():plantilla(),b);return}
  if(d.new||b.id==='bNew'){reset();QS={cat:'',obj:'',voc:''};render();window.scrollTo(0,0);return}
  if(b.id==='bHelp'){tour(0);return}
  if(b.id==='bPrev'){if(S.fase==='diag'){prevQ();return}var i=PHASES.findIndex(function(p){return p[0]===S.fase});if(i>0)go(PHASES[i-1][0]);return}
  if(b.id==='bNext'){if(S.fase==='diag'){nextQ();return}var j=PHASES.findIndex(function(p){return p[0]===S.fase});if(j<PHASES.length-1){var nx=PHASES[j+1][0];if(nx==='diag'&&S.tipo!=='primera'&&!S.segui){}go(nx)}return}
});
function copy(t,b){function done(){var o=b.textContent;b.textContent='Copiado';setTimeout(function(){b.textContent=o},1400)}
  function fallback(){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(x){}document.body.removeChild(a)}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,fallback)}else fallback()}
var TOUR=[['Bienvenida a la guía','La guía te acompaña en toda la llamada. A la izquierda tienes las fases; en el centro, lo que dices y los botones con las respuestas del lead.'],['El curso lo propone la guía','No elijas el curso antes de llamar. Haz las preguntas del diagnóstico: la columna «Curso» de la derecha te va diciendo qué curso le encaja, por qué y qué ofrecer si no cierra.'],['Siempre a mano','Pestañas de la derecha: Catálogo, Objeciones (tecla O), FUNDAE (tecla F) y Términos. Flechas ← → para avanzar y teclas 1–6 para responder.'],['Al terminar','En Cierre eliges el resultado: la guía te dice la etapa del CRM y te prepara el mensaje. En Resumen CRM copias la nota y la pegas en la ficha. Para practicar, carga un caso en la Ficha.']];
function tour(i){var t=document.getElementById('tour');if(i>=TOUR.length){t.hidden=true;try{localStorage.setItem('guia_aedia_tour','1')}catch(x){}return}
  t.hidden=false;t.innerHTML='<div class="card"><div class="eyebrow">Cómo usar la guía · '+(i+1)+' de '+TOUR.length+'</div><h2>'+esc(TOUR[i][0])+'</h2><p>'+esc(TOUR[i][1])+'</p><div class="dots">'+TOUR.map(function(_,j){return '<i class="'+(j===i?'on':'')+'"></i>'}).join('')+'</div><div class="btns"><button class="btn" type="button" id="tNext">'+(i<TOUR.length-1?'Siguiente':'Empezar')+'</button><button class="btn ghost" type="button" id="tSkip">Cerrar</button></div></div>';
  document.getElementById('tNext').onclick=function(){tour(i+1)};document.getElementById('tSkip').onclick=function(){tour(99)}}
document.addEventListener('keydown',function(e){var tg=e.target.tagName;
  if(e.key==='Escape'){document.getElementById('tour').hidden=true;TAB='curso';pane();return}
  if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||e.metaKey||e.ctrlKey||e.altKey)return;

  else if(e.key==='o'||e.key==='O'){TAB='obj';pane()}else if(e.key==='f'||e.key==='F'){TAB='fundae';pane()}
